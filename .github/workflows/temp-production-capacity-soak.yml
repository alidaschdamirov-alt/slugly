name: Temporary Production Capacity Soak

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-capacity-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASE_URL: https://slugly.io
      EXPECTED_COMMIT: e4941ef4713bbd31b702d0575bd388eb12025978
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      E2E_EMAIL: slugly-soak-${{ github.run_id }}@example.com

    steps:
      - name: Checkout temporary soak branch
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Clerk secrets are available
        shell: bash
        run: |
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_PUBLISHABLE_KEY"
          echo "CLERK_SECRETS_PRESENT=yes"

      - name: Install isolated load-test dependencies
        shell: bash
        run: |
          mkdir -p /tmp/slugly-soak-e2e
          cp scripts/temp-production-capacity-soak.mjs /tmp/slugly-soak-e2e/e2e.mjs
          cd /tmp/slugly-soak-e2e
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 @playwright/test@1.55.0 @clerk/testing@latest @trpc/client@11.6.0 superjson@1.13.3 autocannon@8.0.0
          npx playwright install chromium

      - name: Create temporary verified Clerk test user
        shell: bash
        run: |
          cd /tmp/slugly-soak-e2e
          node <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const password = `Slugly-${crypto.randomBytes(20).toString('base64url')}!Aa9`;
          const response = await fetch('https://api.clerk.com/v1/users', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.CLERK_SECRET_KEY}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              email_address: [process.env.E2E_EMAIL],
              password,
              first_name: 'Slugly',
              last_name: 'Capacity Soak',
              skip_legal_checks: true,
            }),
          });
          if (!response.ok) {
            console.error(`TEMP_CLERK_USER_CREATE=failed HTTP ${response.status}`);
            process.exit(1);
          }
          const user = await response.json();
          fs.writeFileSync('/tmp/slugly-soak-e2e/user-id', user.id, 'utf8');
          console.log('TEMP_CLERK_USER_CREATE=success');
          NODE

      - name: Run production capacity soak
        shell: bash
        run: |
          cd /tmp/slugly-soak-e2e
          node e2e.mjs

      - name: Upload capacity soak result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slugly-production-capacity-soak
          path: /tmp/slugly-soak-result.json
          if-no-files-found: ignore

      - name: Delete temporary Clerk test user
        if: always()
        shell: bash
        run: |
          cd /tmp/slugly-soak-e2e
          node <<'NODE'
          import fs from 'node:fs';
          const path = '/tmp/slugly-soak-e2e/user-id';
          if (!fs.existsSync(path)) {
            console.log('TEMP_CLERK_USER_DELETE=not-created');
            process.exit(0);
          }
          const userId = fs.readFileSync(path, 'utf8').trim();
          const response = await fetch(`https://api.clerk.com/v1/users/${encodeURIComponent(userId)}`, {
            method: 'DELETE',
            headers: { authorization: `Bearer ${process.env.CLERK_SECRET_KEY}` },
          });
          if (response.ok || response.status === 404) {
            console.log('TEMP_CLERK_USER_DELETE=success');
          } else {
            console.error(`TEMP_CLERK_USER_DELETE=failed HTTP ${response.status}`);
            process.exit(1);
          }
          NODE
