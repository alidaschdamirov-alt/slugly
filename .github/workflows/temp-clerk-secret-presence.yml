name: Temporary Clerk Secret Presence Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: |
          test -n "$CLERK_SECRET_KEY" && echo "CLERK_SECRET_KEY_PRESENT=yes" || echo "CLERK_SECRET_KEY_PRESENT=no"
          test -n "$CLERK_PUBLISHABLE_KEY" && echo "CLERK_PUBLISHABLE_KEY_PRESENT=yes" || echo "CLERK_PUBLISHABLE_KEY_PRESENT=no"
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" && echo "VITE_CLERK_PUBLISHABLE_KEY_PRESENT=yes" || echo "VITE_CLERK_PUBLISHABLE_KEY_PRESENT=no"
          test -n "$E2E_CLERK_USER_EMAIL" && echo "E2E_CLERK_USER_EMAIL_PRESENT=yes" || echo "E2E_CLERK_USER_EMAIL_PRESENT=no"
