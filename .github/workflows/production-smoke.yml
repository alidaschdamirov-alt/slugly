name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Wait for Render auto-deploy and verify production
        env:
          PRODUCTION_BASE_URL: https://slugly.io
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_NODE_MAJOR: "24"
          SMOKE_MAX_ATTEMPTS: "36"
          SMOKE_DELAY_MS: "20000"
        run: node scripts/smoke-production.mjs
