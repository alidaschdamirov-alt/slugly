name: Temporary Live Browser Smoke v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        run: |
          mkdir -p /tmp/slugly-live/screens
          cd /tmp/slugly-live
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Run live production checks
        env:
          BASE_URL: https://slugly.io
          EXPECTED_COMMIT: ed9e988700195db57cfbd908bba1d1af1de7d7b5
        run: |
          cat >/tmp/slugly-live/smoke.mjs <<'NODE'
          import { chromium, request } from 'playwright';
          import fs from 'node:fs/promises';
          const base = process.env.BASE_URL.replace(/\/$/, '');
          const expected = process.env.EXPECTED_COMMIT;
          const out = '/tmp/slugly-live/screens';
          const results = [];
          const failures = [];
          const assert = (v,m) => { if (!v) throw new Error(m); };

          const api = await request.newContext({ extraHTTPHeaders: { 'cache-control': 'no-cache' } });
          const hr = await api.get(`${base}/healthz?smoke=${Date.now()}`);
          assert(hr.ok(), `healthz HTTP ${hr.status()}`);
          const health = await hr.json();
          assert(health.status === 'ok', `healthz status ${health.status}`);
          assert(String(health.commit || '') === expected, `commit ${health.commit} != ${expected}`);
          assert(String(health.runtime || '').startsWith('v24.'), `runtime ${health.runtime} is not Node 24`);
          results.push({ check:'healthz', status:'PASS', commit:health.commit, runtime:health.runtime });
          await api.dispose();

          const browser = await chromium.launch({ headless:true });
          const ctx = await browser.newContext({ viewport:{ width:1440, height:1000 } });
          const page = await ctx.newPage();
          const sameOrigin5xx = [];
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('response', r => { try { const u=new URL(r.url()); if (u.origin===new URL(base).origin && r.status()>=500) sameOrigin5xx.push(`${r.status()} ${u.pathname}`); } catch {} });

          async function check(name,path,verify,wait=1200) {
            try {
              const res = await page.goto(`${base}${path}`, { waitUntil:'domcontentloaded', timeout:30000 });
              assert(res && res.status() < 500, `${path} HTTP ${res?.status()}`);
              await page.waitForSelector('#root', { timeout:15000 });
              await page.waitForTimeout(wait);
              const body = await page.locator('body').innerText();
              await verify(body);
              await page.screenshot({ path:`${out}/${name}.png`, fullPage:true });
              results.push({ check:name, status:'PASS', http:res?.status(), url:page.url() });
            } catch (e) {
              failures.push(`${name}: ${e instanceof Error ? e.message : String(e)}`);
              try { await page.screenshot({ path:`${out}/${name}-FAIL.png`, fullPage:true }); } catch {}
            }
          }

          await check('homepage','/', async body => {
            assert(body.includes('Slugly'), 'Slugly branding missing');
            assert(body.length > 200, 'homepage unexpectedly empty');
          });
          await check('pricing','/pricing', async body => {
            assert(body.includes('Simple plans for short links that need analytics.'), 'pricing headline missing');
            for (const plan of ['Free','Starter','Pro','Team']) assert(body.includes(plan), `${plan} plan missing`);
            assert(body.includes('Stripe billing is not connected yet.'), 'Stripe placeholder unexpectedly changed');
          });
          await check('auth-signin','/auth', async body => {
            assert(!body.includes('Login is being prepared'), 'Clerk fallback visible');
            await page.locator('input').first().waitFor({ state:'visible', timeout:15000 });
          },2500);
          await check('auth-signup','/auth?mode=signup', async body => {
            assert(!body.includes('Login is being prepared'), 'Clerk signup fallback visible');
            await page.locator('input').first().waitFor({ state:'visible', timeout:15000 });
          },2500);
          for (const [n,p] of [['terms','/terms'],['privacy','/privacy'],['aup','/aup'],['not-found','/404']]) {
            await check(n,p, async body => assert(body.trim().length > 80, `${p} unexpectedly empty`));
          }
          await check('dashboard-unauthenticated','/dashboard', async body => {
            await page.waitForTimeout(1200);
            const authVisible = page.url().includes('/auth') || (await page.locator('input').count()) > 0 || /sign in|log in/i.test(body);
            assert(authVisible, `protected dashboard exposed without auth: ${page.url()}`);
          },1800);

          await browser.close();
          if (sameOrigin5xx.length) failures.push(`same-origin 5xx: ${[...new Set(sameOrigin5xx)].join(', ')}`);
          console.log('LIVE_BROWSER_RESULTS=' + JSON.stringify(results,null,2));
          if (pageErrors.length) console.log('PAGE_ERRORS_DIAGNOSTIC=' + JSON.stringify(pageErrors.slice(0,20),null,2));
          if (failures.length) { console.error('LIVE_BROWSER_FAILURES=' + JSON.stringify(failures,null,2)); process.exit(1); }
          NODE
          cd /tmp/slugly-live
          node smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slugly-live-browser-smoke-v2
          path: /tmp/slugly-live/screens
          if-no-files-found: warn
