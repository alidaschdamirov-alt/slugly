name: Temporary Clerk Authenticated Production E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authenticated-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://slugly.io
      EXPECTED_COMMIT: ed9e988700195db57cfbd908bba1d1af1de7d7b5
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      E2E_EMAIL: slugly-e2e-${{ github.run_id }}@example.com

    steps:
      - name: Checkout temporary E2E branch
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Clerk secrets are available
        shell: bash
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then echo "CLERK_SECRET_KEY_PRESENT=no"; exit 1; fi
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then echo "CLERK_PUBLISHABLE_KEY_PRESENT=no"; exit 1; fi
          echo "CLERK_SECRET_KEY_PRESENT=yes"
          echo "CLERK_PUBLISHABLE_KEY_PRESENT=yes"

      - name: Install isolated Playwright and Clerk testing dependencies
        shell: bash
        run: |
          mkdir -p /tmp/slugly-clerk-e2e/screens
          cp scripts/temp-clerk-production-e2e-v3.mjs /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#await page.getByRole('button', { name: /Add Link/i }).click();#await page.getByRole('button', { name: /Add Link/i }).first().click();#" /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#assert(!(await submit.isDisabled()), 'Create Short Link button is disabled before submit');#for (let wait = 0; wait < 40 \&\& await submit.isDisabled(); wait += 1) await sleep(250); assert(!(await submit.isDisabled()), 'Create Short Link button stayed disabled after workspace load wait');#" /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#assert(/Analytics/i.test(await page.locator('body').innerText()), 'project analytics page missing Analytics');#await page.getByText(/Analytics/i).first().waitFor({ state: 'visible', timeout: 15000 });#" /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#assert(/QR/i.test(await page.locator('body').innerText()), 'QR page failed to render');#await page.getByText(/QR/i).first().waitFor({ state: 'visible', timeout: 15000 });#" /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#await page.waitForTimeout(600);#await page.waitForTimeout(1500);#" /tmp/slugly-clerk-e2e/e2e.mjs
          sed -i "s#await page.getByText('Access denied', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });#const adminBody = await page.locator('body').innerText(); assert(/Access denied|Forbidden/i.test(adminBody), 'nonprivileged admin guard missing');#" /tmp/slugly-clerk-e2e/e2e.mjs
          cd /tmp/slugly-clerk-e2e
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 @playwright/test@1.55.0 @clerk/testing@latest @trpc/client@11.6.0 superjson@1.13.3
          npx playwright install chromium

      - name: Create temporary verified Clerk test user
        shell: bash
        run: |
          cd /tmp/slugly-clerk-e2e
          node <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const password = `Slugly-${crypto.randomBytes(20).toString('base64url')}!Aa9`;
          const response = await fetch('https://api.clerk.com/v1/users', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.CLERK_SECRET_KEY}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              email_address: [process.env.E2E_EMAIL],
              password,
              first_name: 'Slugly',
              last_name: 'E2E',
              skip_legal_checks: true,
            }),
          });
          if (!response.ok) {
            console.error(`Clerk temporary user creation failed: HTTP ${response.status}`);
            process.exit(1);
          }
          const user = await response.json();
          fs.writeFileSync('/tmp/slugly-clerk-e2e/user-id', user.id, 'utf8');
          console.log('TEMP_CLERK_USER_CREATED=yes');
          NODE

      - name: Run full authenticated live production E2E
        shell: bash
        run: |
          cd /tmp/slugly-clerk-e2e
          node e2e.mjs

      - name: Delete temporary Clerk test user
        if: always()
        shell: bash
        run: |
          cd /tmp/slugly-clerk-e2e
          node <<'NODE'
          import fs from 'node:fs';
          const path = '/tmp/slugly-clerk-e2e/user-id';
          if (!fs.existsSync(path)) {
            console.log('TEMP_CLERK_USER_DELETE=not-created');
            process.exit(0);
          }
          const userId = fs.readFileSync(path, 'utf8').trim();
          const response = await fetch(`https://api.clerk.com/v1/users/${encodeURIComponent(userId)}`, {
            method: 'DELETE',
            headers: { authorization: `Bearer ${process.env.CLERK_SECRET_KEY}` },
          });
          if (response.ok || response.status === 404) {
            console.log('TEMP_CLERK_USER_DELETE=success');
          } else {
            console.error(`TEMP_CLERK_USER_DELETE=failed HTTP ${response.status}`);
            process.exit(1);
          }
          NODE

      - name: Upload authenticated production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slugly-clerk-authenticated-production-e2e
          path: /tmp/slugly-clerk-e2e/screens
          if-no-files-found: warn
