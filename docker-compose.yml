services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: slugly
      MYSQL_USER: slugly
      MYSQL_PASSWORD: slugly
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - slugly_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-plocal-root-password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  slugly_mysql:
